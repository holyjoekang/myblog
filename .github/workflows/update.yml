name: 블로그 홈 자동 업데이트
# 매일 아침(한국 시각 7시)과 수동 실행: 네이버 블로그 RSS → data/site.json, 바뀐 것이 있으면 main에 커밋
on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/update_site.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/site.json
          git diff --cached --quiet || (git commit -m "블로그 글 목록 자동 업데이트" && git push)
